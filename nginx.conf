server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving via a variable (instead of a literal
    # hostname in proxy_pass) forces nginx to re-resolve every valid=10s
    # instead of caching the backend's IP for the life of the worker process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to the backend container
    location ^~ /services {
        set $backend http://apollo-server-dashboard-backend:8001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /config {
        set $backend http://apollo-server-dashboard-backend:8001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /auth {
        set $backend http://apollo-server-dashboard-backend:8001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /version {
        set $backend http://apollo-server-dashboard-backend:8001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Never cache index.html — it references content-hashed JS/CSS, so a
    # cached copy would keep pointing at a deleted, previous-deploy bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Serve the React SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
